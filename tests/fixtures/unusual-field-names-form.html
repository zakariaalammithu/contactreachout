<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom Form Builder Contact Page</title>
</head>
<body>
  <h1>Custom Portal Inquiries</h1>

  <form id="wpforms-form-10492" action="/process" method="POST">
    <!-- Unusual Name: Full Name with semantic label -->
    <div class="form-row">
      <label for="wpforms-10492-field_0">Your Full Name</label>
      <input type="text" id="wpforms-10492-field_0" name="wpforms[fields][0]" placeholder="Alex Rivera" required />
    </div>

    <!-- Unusual Name: Email with placeholder & type="email" -->
    <div class="form-row">
      <label for="wpforms-10492-field_1">Business Email Address</label>
      <input type="email" id="wpforms-10492-field_1" name="wpforms[fields][1]" placeholder="name@company.com" required />
    </div>

    <!-- Unusual Name: Company with label 'Organization / Agency' -->
    <div class="form-row">
      <label for="wpforms-10492-field_2">Organization / Agency</label>
      <input type="text" id="wpforms-10492-field_2" name="wpforms[fields][2]" />
    </div>

    <!-- Unusual Name: Message Textarea -->
    <div class="form-row">
      <label for="wpforms-10492-field_3">Project Summary / Questions</label>
      <textarea id="wpforms-10492-field_3" name="wpforms[fields][3]" rows="4" required></textarea>
    </div>

    <!-- Honeypot Field generated by form builder -->
    <div class="wpforms-field-hp" style="display:none !important; visibility:hidden;">
      <label for="wpforms-10492-field_hp">Please leave blank</label>
      <input type="text" id="wpforms-10492-field_hp" name="wpforms[hp]" tabindex="-1" autocomplete="off" />
    </div>

    <button type="submit" id="wpforms-submit-10492">Submit Form</button>
  </form>
</body>
</html>
