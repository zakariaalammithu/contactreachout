<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us — Standard Clean Company</title>
</head>
<body>
  <h1>Get in Touch with Our Team</h1>
  <p>Please fill out the form below and we will respond within 24 hours.</p>

  <form id="contact-form" action="/api/submit" method="POST">
    <div>
      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" name="full_name" placeholder="Your full name" required />
    </div>

    <div>
      <label for="work_email">Business Email</label>
      <input type="email" id="work_email" name="work_email" placeholder="you@company.com" required />
    </div>

    <div>
      <label for="company_name">Company Name</label>
      <input type="text" id="company_name" name="company_name" placeholder="Company Ltd" />
    </div>

    <div>
      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" placeholder="Inquiry subject" />
    </div>

    <div>
      <label for="message_text">Message</label>
      <textarea id="message_text" name="message_text" rows="5" placeholder="How can we help?" required></textarea>
    </div>

    <!-- Hidden Honeypot Anti-Bot Trap -->
    <div style="display:none;">
      <label for="website_url_hp">Leave this field blank</label>
      <input type="text" id="website_url_hp" name="website_url_hp" tabindex="-1" autocomplete="off" />
    </div>

    <button type="submit" id="btn-submit">Send Inquiry</button>
  </form>
</body>
</html>
