<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minimalist SaaS — Direct Reachout</title>
</head>
<body>
  <h1>Drop us a line</h1>
  <form id="minimal-form" action="/contact" method="POST">
    <div><input type="text" name="f1" placeholder="Enter your full name" /></div>
    <div><input type="email" name="f2" placeholder="business@company.com" /></div>
    <div><input type="text" name="f3" placeholder="Company / Organization" /></div>
    <div><textarea name="f4" placeholder="Tell us about your project..."></textarea></div>
    <button type="submit">Send Message</button>
  </form>
</body>
</html>
