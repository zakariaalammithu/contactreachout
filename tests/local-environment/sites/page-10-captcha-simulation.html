<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberShield Security — Protected Contact</title>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
  <h1>CyberShield Inquiries</h1>
  <form id="captcha-protected-form" action="/contact/verify" method="POST">
    <div>
      <label for="contact_name">Name</label>
      <input type="text" id="contact_name" name="contact_name" />
    </div>

    <div>
      <label for="contact_email">Email</label>
      <input type="email" id="contact_email" name="contact_email" />
    </div>

    <div>
      <label for="contact_notes">Message</label>
      <textarea id="contact_notes" name="contact_notes"></textarea>
    </div>

    <!-- Google reCAPTCHA Badge -->
    <div class="g-recaptcha" data-sitekey="6Ld_sample_key_for_testing"></div>

    <button type="submit">Submit Verification</button>
  </form>
</body>
</html>
